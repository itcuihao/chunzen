<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft warm watercolor wash halo matching new icon.png -->
    <radialGradient id="warmHalo" cx="48%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#EED4AC" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#F5E5CB" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FAF7F0" stop-opacity="0"/>
    </radialGradient>

    <!-- Bamboo stalk gradient (natural spring green) -->
    <linearGradient id="bambooStalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EB383"/>
      <stop offset="35%" stop-color="#4B7F57"/>
      <stop offset="78%" stop-color="#2E5939"/>
      <stop offset="100%" stop-color="#1E3F27"/>
    </linearGradient>

    <!-- Bamboo leaf gradient -->
    <linearGradient id="bambooLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BC08E"/>
      <stop offset="55%" stop-color="#4D8059"/>
      <stop offset="100%" stop-color="#285033"/>
    </linearGradient>

    <!-- Warm espresso-brown cicada body (soft, organic, non-harsh) -->
    <linearGradient id="cicadaBody" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#5B4D44"/>
      <stop offset="45%" stop-color="#3B302A"/>
      <stop offset="100%" stop-color="#241C18"/>
    </linearGradient>

    <!-- Translucent warm-amber cicada wing (matches new icon.png) -->
    <linearGradient id="wingAmber" x1="85%" y1="12%" x2="15%" y2="88%">
      <stop offset="0%" stop-color="#C87433" stop-opacity="0.88"/>
      <stop offset="38%" stop-color="#E7B374" stop-opacity="0.72"/>
      <stop offset="75%" stop-color="#F6DFB7" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#FBF2DF" stop-opacity="0.50"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#2C241E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Soft warm paper aura (transparent outside so it blends on any background) -->
  <circle cx="490" cy="495" r="395" fill="url(#warmHalo)"/>

  <g filter="url(#softShadow)">
    <!-- BAMBOO STALK (bottom-left to top-right, natural angle ~ -42 deg) -->
    <g transform="translate(512, 512) rotate(-42)">
      <!-- Lower-right delicate bamboo twig & 3 leaves (behind stalk) -->
      <path d="M -182 30 Q -50 68 95 70" fill="none" stroke="#3D6B49" stroke-width="7.5" stroke-linecap="round"/>
      <!-- Leaf 1 (pointing right) -->
      <path d="M 38 66 C 122 50, 210 56, 286 82 C 206 86, 120 84, 38 72 Z" fill="url(#bambooLeaf)"/>
      <path d="M 48 69 Q 158 66 266 80" fill="none" stroke="#CBE3C6" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- Leaf 2 (pointing down-right) -->
      <path d="M 16 68 C 90 106, 152 165, 198 242 C 132 192, 74 138, 12 74 Z" fill="url(#bambooLeaf)" opacity="0.92"/>
      <!-- Leaf 3 (small lower sprout) -->
      <path d="M -52 55 C -4 88, 36 130, 62 184 C 22 140, -16 102, -56 60 Z" fill="url(#bambooLeaf)" opacity="0.88"/>

      <!-- Upper-node delicate twig & 3 leaves -->
      <path d="M 218 -14 Q 260 -62 292 -118" fill="none" stroke="#3D6B49" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Upper leaf left -->
      <path d="M 258 -68 C 218 -134, 196 -196, 190 -266 C 226 -202, 248 -140, 266 -74 Z" fill="url(#bambooLeaf)"/>
      <!-- Upper leaf center-top -->
      <path d="M 282 -102 C 304 -176, 342 -236, 396 -284 C 362 -218, 326 -160, 288 -98 Z" fill="url(#bambooLeaf)" opacity="0.95"/>
      <!-- Upper leaf small -->
      <path d="M 264 -76 C 304 -112, 348 -136, 404 -148 C 354 -116, 310 -94, 268 -68 Z" fill="url(#bambooLeaf)" opacity="0.90"/>

      <!-- Main Bamboo Segments -->
      <!-- Segment 1 -->
      <path d="M -430 -8 L -196 -10 C -190 -10, -190 32, -196 32 L -430 34 Z" fill="url(#bambooStalk)"/>
      <!-- Segment 2 (main perch) -->
      <path d="M -182 -10 L 208 -10 C 214 -10, 214 32, 208 32 L -182 32 Z" fill="url(#bambooStalk)"/>
      <!-- Segment 3 -->
      <path d="M 222 -10 L 440 -12 L 440 30 L 222 32 C 216 32, 216 -10, 222 -10 Z" fill="url(#bambooStalk)"/>

      <!-- Bamboo Node Rings (organic double ridge) -->
      <path d="M -198 -13 Q -189 -15 -180 -13 L -180 34 Q -189 36 -198 34 Z" fill="#63986E" stroke="#1E3F27" stroke-width="2.5"/>
      <path d="M -189 -13 L -189 34" stroke="#CBE3C6" stroke-opacity="0.45" stroke-width="2"/>

      <path d="M 206 -13 Q 215 -15 224 -13 L 224 34 Q 215 36 206 34 Z" fill="#63986E" stroke="#1E3F27" stroke-width="2.5"/>
      <path d="M 215 -13 L 215 34" stroke="#CBE3C6" stroke-opacity="0.45" stroke-width="2"/>

      <!-- Bamboo upper specular sheen -->
      <line x1="-410" y1="-2" x2="420" y2="-4" stroke="#D8ECD4" stroke-opacity="0.38" stroke-width="3.5" stroke-linecap="round"/>

      <!-- CICADA PERCHED NATURALLY ON BAMBOO -->
      <g transform="translate(8, -14)">
        <!-- Three pairs of legs gripping the bamboo naturally -->
        <g fill="none" stroke="#362B25" stroke-linecap="round" stroke-linejoin="round">
          <!-- Front leg (bent downward from thorax to clasp bamboo) -->
          <path d="M 96 -14 L 122 -6 L 132 10" stroke-width="7.5"/>
          <path d="M 96 -14 L 122 -6 L 132 10" stroke="#5A4B42" stroke-width="2.5"/>
          <!-- Middle leg -->
          <path d="M 52 -12 L 78 -2 L 76 14" stroke-width="7"/>
          <path d="M 52 -12 L 78 -2" stroke="#5A4B42" stroke-width="2.2"/>
          <!-- Hind leg -->
          <path d="M 2 -10 L 28 0 L 28 13" stroke-width="6.5"/>
        </g>

        <!-- Abdomen (partially visible beneath translucent amber wings) -->
        <path d="
          M -154 2
          C -98 14, -8 12, 58 -4
          C 72 -18, 66 -46, 36 -54
          C -34 -56, -110 -28, -154 2
          Z"
          fill="url(#cicadaBody)"/>
        <!-- Subtle abdomen segments -->
        <g fill="none" stroke="#6E5D52" stroke-opacity="0.55" stroke-width="2.2">
          <path d="M -28 -38 Q -18 -14 -24 6"/>
          <path d="M -56 -32 Q -46 -12 -52 6"/>
          <path d="M -84 -24 Q -76 -8 -80 6"/>
          <path d="M -112 -14 Q -106 -2 -108 4"/>
        </g>

        <!-- Thorax / Pronotum (sculpted warm dark brown) -->
        <path d="
          M 22 -58
          C 56 -72, 102 -68, 122 -42
          C 130 -24, 114 -4, 82 -2
          C 50 -2, 24 -20, 22 -58
          Z"
          fill="url(#cicadaBody)" stroke="#231B17" stroke-width="2.5"/>
        <!-- Pronotum collar ridge -->
        <path d="M 64 -62 Q 78 -36 68 -8" fill="none" stroke="#6B5A4F" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Head & large expressive eye -->
        <path d="
          M 102 -62
          C 126 -64, 146 -48, 142 -24
          C 138 -8, 118 0, 98 -6
          C 94 -24, 96 -46, 102 -62
          Z"
          fill="url(#cicadaBody)" stroke="#231B17" stroke-width="2.5"/>
        <!-- Compound eye -->
        <circle cx="122" cy="-42" r="12" fill="#1E1714" stroke="#5E4F46" stroke-width="1.8"/>
        <circle cx="125" cy="-46" r="3.6" fill="#FAF7F0" fill-opacity="0.85"/>
        <!-- Fine antennae -->
        <path d="M 134 -52 Q 152 -66 168 -64" fill="none" stroke="#3B302A" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M 122 -58 Q 134 -78 144 -86" fill="none" stroke="#3B302A" stroke-width="2.2" stroke-linecap="round"/>

        <!-- FOLDED TRANSLUCENT AMBER WINGS (layered naturally over back) -->
        <!-- Hind wing subtle layer -->
        <path d="
          M 44 -28
          C -36 -28, -142 -10, -236 12
          C -246 15, -242 22, -224 23
          C -136 26, -32 14, 48 -10
          Z"
          fill="#E7B374" fill-opacity="0.45" stroke="#8C5427" stroke-opacity="0.65" stroke-width="2"/>

        <!-- Main forewing -->
        <path d="
          M 62 -44
          C -12 -64, -138 -42, -252 6
          C -268 13, -264 26, -238 25
          C -140 24, -22 6, 56 -22
          C 72 -28, 76 -40, 62 -44
          Z"
          fill="url(#wingAmber)" stroke="#4A3628" stroke-width="3.2" stroke-linejoin="round"/>

        <!-- Delicate organic wing veins -->
        <g fill="none" stroke="#4A3628" stroke-opacity="0.68" stroke-linecap="round">
          <path d="M 48 -38 C -30 -44, -132 -26, -234 10" stroke-width="2.4"/>
          <path d="M 40 -30 C -36 -28, -128 -10, -212 16" stroke-width="2"/>
          <path d="M 28 -22 C -42 -14, -118 0, -180 20" stroke-width="1.8"/>
          <!-- Cross veins forming realistic cicada wing cells -->
          <path d="M -56 -24 L -40 -6" stroke-width="1.6"/>
          <path d="M -112 -16 L -96 4" stroke-width="1.6"/>
          <path d="M -166 -4 L -150 12" stroke-width="1.5"/>
          <path d="M -78 -6 L -68 10" stroke-width="1.4"/>
          <path d="M -134 4 L -124 16" stroke-width="1.4"/>
        </g>

        <!-- Soft specular highlight on wing root -->
        <ellipse cx="42" cy="-38" rx="18" ry="6" transform="rotate(-12 42 -38)"
                 fill="#FFF8EB" fill-opacity="0.38"/>
      </g>
    </g>
  </g>
</svg>
